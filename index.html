<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Pro - Comercial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
      // CONFIGURAÇÃO DO FIREBASE (CORRIGIDA)
      const firebaseConfig = {
        apiKey: "AIzaSyBWTZ5PIVEXgNV08LN-FQXhIQ3MV9Mzrj4",
        authDomain: "projeto-financeiro-ea099.firebaseapp.com",
        projectId: "projeto-financeiro-ea099",
        storageBucket: "projeto-financeiro-ea099.firebasestorage.app",
        messagingSenderId: "14585793869", // CORRIGIDO: Removido o '6' intruso
        appId: "1:14585793869:web:471f922181be8f285e3444",
        measurementId: "G-WD6JD0VGR5"
      };

      // Inicialização dos Serviços
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();

      let usuarioAtual = null;
      let meuGrafico;
      let todosOsDados = [];
      let dadosFiltrados = [];
      let modoAppAtual = 'Saída';
      let paginaAtual = 1;
      const itensPorPagina = 5;

      const categoriasSaidas = ["Alimentação", "Moradia", "Transporte", "Lazer", "Saúde", "Outros"];
      const categoriasEntradas = ["Salário", "Investimentos", "Freelance", "Outros"];

      // Executa assim que a estrutura do HTML estiver pronta
      document.addEventListener("DOMContentLoaded", () => {
        montarSelectCategorias(categoriasSaidas);
        resetarDataInput();
      });

      // Monitor de Autenticação
      auth.onAuthStateChanged((user) => {
        if (user) {
          usuarioAtual = user;
          document.getElementById('tela-auth').classList.add('hidden');
          document.getElementById('tela-dashboard').classList.remove('hidden');
          carregarDadosUsuario();
        } else {
          usuarioAtual = null;
          document.getElementById('tela-dashboard').classList.add('hidden');
          document.getElementById('tela-auth').classList.remove('hidden');
        }
      });

      // Função de Cadastro
      async function cadastrarUsuario() {
        const email = document.getElementById('auth-email').value.trim();
        const senha = document.getElementById('auth-senha').value;
        if(!email || !senha) return Swal.fire('Erro', 'Preencha todos os campos!', 'error');
        
        try {
          await auth.createUserWithEmailAndPassword(email, senha);
          Swal.fire('Sucesso!', 'Conta criada com sucesso!', 'success');
        } catch (error) {
          console.error(error);
          Swal.fire('Erro ao cadastrar', traduzirErroFirebase(error.code), 'error');
        }
      }

      // Função de Login
      async function logarUsuario() {
        const email = document.getElementById('auth-email').value.trim();
        const senha = document.getElementById('auth-senha').value;
        if(!email || !senha) return Swal.fire('Erro', 'Preencha todos os campos!', 'error');

        try {
          await auth.signInWithEmailAndPassword(email, senha);
        } catch (error) {
          Swal.fire('Erro ao entrar', traduzirErroFirebase(error.code), 'error');
        }
      }

      function fazerLogout() {
        auth.signOut();
      }

      function traduzirErroFirebase(codigo) {
        switch(codigo) {
          case 'auth/invalid-credential': return 'E-mail ou senha incorretos.';
          case 'auth/email-already-in-use': return 'Este e-mail já está cadastrado.';
          case 'auth/weak-password': return 'A senha deve ter no mínimo 6 caracteres.';
          case 'auth/invalid-email': return 'Formato de e-mail inválido.';
          case 'auth/operation-not-allowed': return 'O login por Email/Senha não está ativo no Firebase Console.';
          default: return 'Erro na conexão com o servidor. Verifique o passo 1.';
        }
      }

      // GRAVAÇÃO NO FIRESTORE
      async function enviarDados() {
        const btn = document.getElementById('btn');
        const dataInput = document.getElementById('data').value;
        const descricao = document.getElementById('desc').value;
        const valorRaw = document.getElementById('valor').value;
        const categoria = document.getElementById('categoria').value;

        if(!dataInput || !descricao || !valorRaw) {
          return Swal.fire('Atenção', 'Preencha todos os campos!', 'warning');
        }

        btn.disabled = true;
        btn.innerText = "SALVANDO...";

        let limpo = valorRaw.replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.');
        let valorNum = parseFloat(limpo);
        if (isNaN(valorNum)) valorNum = 0;

        valorNum = modoAppAtual === 'Saída' ? -Math.abs(valorNum) : Math.abs(valorNum);

        try {
          await db.collection("lancamentos").add({
            userId: usuarioAtual.uid,
            data: dataInput,
            descricao: descricao,
            categoria: categoria,
            valor: valorNum,
            tipo: modoAppAtual,
            criadoEm: new Date().toISOString()
          });

          Swal.fire({ icon: 'success', title: 'Salvo!', timer: 1200, showConfirmButton: false });
          document.getElementById('desc').value = "";
          document.getElementById('valor').value = "";
          carregarDadosUsuario();
        } catch (e) {
          Swal.fire('Erro', 'Não foi possível salvar o registro.', 'error');
        } finally {
          btn.disabled = false;
          btn.innerText = "GRAVAR REGISTRO";
        }
      }

      // CARREGAR DO FIRESTORE
      async function carregarDadosUsuario() {
        resetarDataInput();
        const anoAtual = new Date().getFullYear().toString();

        try {
          const querySnapshot = await db.collection("lancamentos")
            .where("userId", "==", usuarioAtual.uid)
            .get();
          
          todosOsDados = [];
          querySnapshot.forEach((doc) => {
            const item = doc.data();
            if(item.data.startsWith(anoAtual)) {
              todosOsDados.push(item);
            }
          });

          todosOsDados.sort((a, b) => b.data.localeCompare(a.data));

          atualizarSaldosEMetricas();
          montarSelectCategorias(modoAppAtual === 'Saída' ? categoriasSaidas : categoriasEntradas);
          aplicarFiltroETabela();
          renderizarGraficoMensal();

        } catch (error) {
          console.error("Erro ao puxar dados: ", error);
        }
      }

      function atualizarSaldosEMetricas() {
        let entradas = 0;
        let saidas = 0;
        todosOsDados.forEach(item => {
          if(item.tipo === 'Entrada') entradas += item.valor;
          else saidas += Math.abs(item.valor);
        });
        const saldoTotal = entradas - saidas;
        document.getElementById('resumo-saldo').innerText = "R$ " + saldoTotal.toLocaleString("pt-BR", { minimumFractionDigits: 2 });
        document.getElementById('resumo-entradas').innerText = "R$ " + entradas.toLocaleString("pt-BR", { minimumFractionDigits: 2 });
        document.getElementById('resumo-saidas').innerText = "R$ " + saidas.toLocaleString("pt-BR", { minimumFractionDigits: 2 });
      }

      function mascaraMoeda(campo) {
        let valor = campo.value.replace(/\D/g, "");
        valor = (valor / 100).toFixed(2) + "";
        valor = valor.replace(".", ",");
        valor = valor.replace(/(\d)(\d{3})(?=\d)/g, "$1.$2");
        campo.value = valor ? "R$ " + valor : "";
      }

      function resetarDataInput() {
        const hoje = new Date();
        const yyyy = hoje.getFullYear();
        const mm = String(hoje.getMonth() + 1).padStart(2, '0');
        const dd = String(hoje.getDate()).padStart(2, '0');
        const campoData = document.getElementById('data');
        if (campoData) campoData.value = `${yyyy}-${mm}-${dd}`;
      }

      function montarSelectCategorias(lista) {
        const campoCategoria = document.getElementById('categoria');
        if (campoCategoria) {
          campoCategoria.innerHTML = lista.map(c => `<option value="${c}">${c}</option>`).join('');
        }
      }

      function aplicarFiltroETabela() {
        dadosFiltrados = todosOsDados.filter(linha => linha.tipo === modoAppAtual);
        renderizarTabela();
      }

      function renderizarTabela() {
        const corpo = document.getElementById('tabela-corpo');
        const totalItens = dadosFiltrados.length;
        const totalPaginas = Math.ceil(totalItens / itensPorPagina) || 1;

        if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;

        const inicio = (paginaAtual - 1) * itensPorPagina;
        const fim = inicio + itensPorPagina;
        const dadosPagina = dadosFiltrados.slice(inicio, fim);

        if(dadosPagina.length === 0) {
          corpo.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-400">Nenhum registro nesta visão</td></tr>`;
          document.getElementById('info-paginas').innerText = `Página 1 de 1`;
          document.getElementById('btn-prev').disabled = true;
          document.getElementById('btn-next').disabled = true;
          return;
        }

        corpo.innerHTML = dadosPagina.map(linha => {
          const partesData = Serverlinha = linha.data.split('-');
          return `
            <tr class="border-b border-slate-50 hover:bg-slate-50/80 transition">
              <td class="py-4 px-2 text-[10px] text-slate-400 font-extrabold">${partesData[2]}/${partesData[1]}/${partesData[0]}</td>
              <td class="py-4 px-2 text-slate-800">${linha.descricao}</td>
              <td class="py-4 px-2"><span class="bg-purple-50 text-purple-600 px-3 py-1 rounded-xl text-[10px] font-black uppercase tracking-wider">${linha.categoria}</span></td>
              <td class="py-4 px-2 text-right font-black ${linha.valor < 0 ? 'text-rose-500' : 'text-emerald-500'}">
                ${linha.valor < 0 ? '-' : '+'} R$ ${Math.abs(linha.valor).toLocaleString("pt-BR", { minimumFractionDigits: 2 })}
              </td>
            </tr>
          `;
        }).join('');

        document.getElementById('info-paginas').innerText = `Página ${paginaAtual} de ${totalPaginas}`;
        document.getElementById('btn-prev').disabled = paginaAtual === 1;
        document.getElementById('btn-next').disabled = paginaAtual === totalPaginas;
      }

      function paginaAnterior() { if (paginaAtual > 1) { paginaAtual--; renderizarTabela(); } }
      function proximaPagina() { const totalPaginas = Math.ceil(dadosFiltrados.length / itensPorPagina); if (paginaAtual < totalPaginas) { paginaAtual++; renderizarTabela(); } }

      function mudarModoApp(novoModo) {
        modoAppAtual = novoModo;
        paginaAtual = 1;
        const btnGasto = document.getElementById('modo-gasto');
        const btnEntrada = document.getElementById('modo-entrada');
        const cardEntradas = document.getElementById('card-entradas');
        const cardSaidas = document.getElementById('card-saidas');
        const inputValor = document.getElementById('valor');
        const btnSubmit = document.getElementById('btn');
        const tituloGrafico = document.getElementById('grafico-titulo');

        inputValor.value = "";

        if (novoModo === 'Saída') {
          btnGasto.className = "w-full py-3 rounded-xl bg-slate-900 text-white shadow-md transition-all flex justify-center items-center gap-2";
          btnEntrada.className = "w-full py-3 rounded-xl text-slate-600 transition-all flex justify-center items-center gap-2";
          cardSaidas.className = "flex justify-between items-center bg-rose-50 p-3 rounded-2xl border-2 border-rose-400 transition-all";
          cardEntradas.className = "flex justify-between items-center mb-5 bg-emerald-50 p-3 rounded-2xl transition-all";
          document.getElementById('form-titulo').innerHTML = `<span class="bg-rose-100 p-2 rounded-xl text-rose-600">📉</span> Novo Gasto`;
          tituloGrafico.innerHTML = `<span class="bg-rose-100 p-2 rounded-xl text-rose-600">📊</span> Gastos Mês a Mês`;
          inputValor.className = "w-full p-4 bg-slate-50 rounded-2xl outline-none border border-transparent focus:border-purple-500 focus:bg-white transition font-black text-rose-600 mt-1";
          btnSubmit.className = "w-full bg-slate-900 text-white font-black py-5 rounded-2xl hover:bg-rose-600 transition-all active:scale-95 shadow-lg mt-2 tracking-wider";
          montarSelectCategorias(categoriasSaidas);
        } else {
          btnGasto.className = "w-full py-3 rounded-xl text-slate-600 transition-all flex justify-center items-center gap-2";
          btnEntrada.className = "w-full py-3 rounded-xl bg-slate-900 text-white shadow-md transition-all flex justify-center items-center gap-2";
          cardSaidas.className = "flex justify-between items-center bg-rose-50 p-3 rounded-2xl transition-all";
          cardEntradas.className = "flex justify-between items-center mb-5 bg-emerald-50 p-3 rounded-2xl border-2 border-emerald-400 transition-all";
          document.getElementById('form-titulo').innerHTML = `<span class="bg-emerald-100 p-2 rounded-xl text-emerald-600">💰</span> Nova Entrada`;
          tituloGrafico.innerHTML = `<span class="bg-emerald-100 p-2 rounded-xl text-emerald-600">📊</span> Entradas Mês a Mês`;
          inputValor.className = "w-full p-4 bg-slate-50 rounded-2xl outline-none border border-transparent focus:border-purple-500 focus:bg-white transition font-black text-emerald-600 mt-1";
          btnSubmit.className = "w-full bg-slate-900 text-white font-black py-5 rounded-2xl hover:bg-emerald-600 transition-all active:scale-95 shadow-lg mt-2 tracking-wider";
          montarSelectCategorias(categoriasEntradas);
        }
        aplicarFiltroETabela();
        renderizarGraficoMensal();
      }

      function renderizarGraficoMensal() {
        const canvas = document.getElementById('graficoMensal');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (meuGrafico) meuGrafico.destroy();

        const mesesNomes = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
        const valoresMeses = new Array(12).fill(0);

        todosOsDados.filter(item => item.tipo === modoAppAtual).forEach(item => {
          const mesIndex = parseInt(item.data.split('-')[1]) - 1;
          if(mesIndex >= 0 && mesIndex < 12) valoresMeses[mesIndex] += Math.abs(item.valor);
        });

        const corGrafico = modoAppAtual === 'Saída' ? '#f43f5e' : '#10b981';
        const labelGrafico = modoAppAtual === 'Saída' ? 'Total Gasto (R$)' : 'Total Recebido (R$)';

        meuGrafico = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: mesesNomes,
            datasets: [{ label: labelGrafico, data: valoresMeses, backgroundColor: corGrafico, borderRadius: 8 }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { grid: { color: '#f1f5f9' }, ticks: { font: { family: 'Plus Jakarta Sans', size: 10, weight: 'bold' } } },
              x: { grid: { display: false }, ticks: { font: { family: 'Plus Jakarta Sans', size: 10, weight: 'bold' } } }
            }
          }
        });
      }
    </script>
    
    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; color: #0f172a; }
      .bg-vibrant-grad { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #c084fc 100%); }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      canvas { max-height: 250px !important; }
    </style>
  </head>
  
  <body class="bg-slate-50 min-h-screen">

    <div id="tela-auth" class="flex items-center justify-center min-h-screen p-4">
      <div class="bg-white rounded-3xl p-8 shadow-2xl w-full max-w-md border border-slate-100">
        <div class="text-center mb-8">
          <span class="text-4xl">🚀</span>
          <h2 class="text-2xl font-black text-slate-800 mt-2">Finanças Pro</h2>
          <p class="text-slate-400 text-sm font-semibold mt-1">Crie sua conta ou faça login para começar</p>
        </div>
        <div class="space-y-4">
          <div>
            <label class="text-xs font-extrabold text-slate-400 tracking-wider">E-MAIL</label>
            <input type="email" id="auth-email" placeholder="seu@email.com" class="w-full p-4 bg-slate-50 rounded-2xl outline-none border border-transparent focus:border-purple-500 focus:bg-white transition mt-1 font-semibold text-slate-700">
          </div>
          <div>
            <label class="text-xs font-extrabold text-slate-400 tracking-wider">SENHA</label>
            <input type="password" id="auth-senha" placeholder="No mínimo 6 dígitos" class="w-full p-4 bg-slate-50 rounded-2xl outline-none border border-transparent focus:border-purple-500 focus:bg-white transition mt-1 font-semibold text-slate-700">
          </div>
          <div class="grid grid-cols-2 gap-4 pt-2">
            <button onclick="logarUsuario()" class="bg-slate-900 text-white font-black py-4 rounded-2xl hover:bg-slate-800 transition active:scale-95 text-sm">ENTRAR</button>
            <button onclick="cadastrarUsuario()" class="bg-purple-50 text-purple-600 font-black py-4 rounded-2xl hover:bg-purple-100 transition active:scale-95 text-sm">CADASTRAR</button>
          </div>
        </div>
      </div>
    </div>

    <div id="tela-dashboard" class="p-4 md:p-8 max-w-6xl mx-auto hidden">
      <div class="flex justify-between items-center mb-6">
        <span class="text-xs font-extrabold bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl uppercase tracking-wider">Modo Comercial 🌍</span>
        <button onclick="fazerLogout()" class="text-xs font-black text-rose-500 bg-rose-50 px-3 py-2 rounded-xl hover:bg-rose-100 transition">Sair do App 🚪</button>
      </div>

      <div class="flex bg-slate-200/80 p-1.5 rounded-2xl max-w-md mx-auto mb-8 text-sm font-black shadow-inner">
        <button onclick="mudarModoApp('Saída')" id="modo-gasto" class="w-full py-3 rounded-xl bg-slate-900 text-white shadow-md transition-all flex justify-center items-center gap-2">📉 Modo Gastos</button>
        <button onclick="mudarModoApp('Entrada')" id="modo-entrada" class="w-full py-3 rounded-xl text-slate-600 transition-all flex justify-center items-center gap-2">💰 Modo Entradas</button>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="md:col-span-2 bg-vibrant-grad rounded-3xl p-8 text-white shadow-2xl shadow-purple-200 flex flex-col justify-center relative overflow-hidden">
          <p class="text-purple-100 text-xs font-extrabold uppercase tracking-widest opacity-90">Seu Saldo Disponível</p>
          <h1 id="resumo-saldo" class="text-5xl font-black mt-2 tracking-tight">R$ 0,00</h1>
        </div>
        <div class="bg-white rounded-3xl p-6 shadow-xl shadow-slate-100 flex flex-col justify-center border border-slate-100/80">
          <div id="card-entradas" class="flex justify-between items-center mb-5 bg-emerald-50 p-3 rounded-2xl">
            <span class="text-emerald-800 font-bold text-sm">💰 Receitas</span>
            <span id="resumo-entradas" class="text-emerald-500 font-black text-xl">R$ 0,00</span>
          </div>
          <div id="card-saidas" class="flex justify-between items-center bg-rose-50 p-3 rounded-2xl border-2 border-rose-400">
            <span class="text-rose-800 font-bold text-sm">🔥 Despesas</span>
            <span id="resumo-saidas" class="text-rose-500 font-black text-xl">R$ 0,00</span>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
        <div class="lg:col-span-2">
          <div class="bg-white rounded-3xl shadow-xl shadow-slate-100 border border-slate-100 p-6 sticky top-8">
            <h2 id="form-titulo" class="text-xl font-black text-slate-800 mb-6 flex items-center gap-2">📉 Novo Gasto</h2>
            <div class="space-y-4">
              <div>
                <label class="text-xs font-extrabold text-slate-400 tracking-wider">QUANDO FOI?</label>
                <input type="date" id="data" class="w-full p-4 bg-slate-50 rounded-2xl outline-none border border-transparent focus:border-purple-500 focus:bg-white transition mt-1 font-bold text-slate-700">
              </div>
              <div>
                <label class="text-xs font-extrabold text-slate-400 tracking-wider">DESCRIÇÃO</label>
                <input type="text" id="desc" placeholder="Ex: Mercado, Aluguel..." class="w-full p-4 bg-slate-50 rounded-2xl outline-none border border-transparent focus:border-purple-500 focus:bg-white transition mt-1 font-semibold text-slate-700">
              </div>
              <div>
                <label class="text-xs font-extrabold text-slate-400 tracking-wider">VALOR</label>
                <input type="text" id="valor" oninput="mascaraMoeda(this)" placeholder="R$ 0,00" class="w-full p-4 bg-slate-50 rounded-2xl outline-none border border-transparent focus:border-purple-500 focus:bg-white transition font-black text-rose-600 mt-1">
              </div>
              <div>
                <label class="text-xs font-extrabold text-slate-400 tracking-wider">CATEGORIA</label>
                <select id="categoria" class="w-full p-4 bg-slate-50 rounded-2xl outline-none border border-transparent focus:border-purple-500 focus:bg-white transition font-bold text-slate-700 appearance-none mt-1"></select>
              </div>
              <button onclick="enviarDados()" id="btn" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl hover:bg-rose-600 transition-all shadow-lg mt-2 tracking-wider">GRAVAR REGISTRO</button>
            </div>
          </div>
        </div>

        <div class="lg:col-span-3 space-y-8">
          <div class="bg-white rounded-3xl shadow-xl shadow-slate-100 border border-slate-100 p-6">
            <h2 id="grafico-titulo" class="text-xl font-black text-slate-800 mb-6 flex items-center gap-2">📊 Gastos Mês a Mês</h2>
            <div class="relative h-64"><canvas id="graficoMensal"></canvas></div>
          </div>
          <div class="bg-white rounded-3xl shadow-xl shadow-slate-100 border border-slate-100 p-6 overflow-hidden">
            <h2 class="text-xl font-black text-slate-800 mb-6 flex items-center gap-2">📅 Histórico de Transações</h2>
            <div class="overflow-x-auto no-scrollbar">
              <table class="w-full text-left">
                <thead>
                  <tr class="text-slate-400 text-[10px] uppercase font-black border-b border-slate-100 tracking-widest">
                    <th class="pb-4 px-2">Data</th>
                    <th class="pb-4 px-2">Descrição</th>
                    <th class="pb-4 px-2">Categoria</th>
                    <th class="pb-4 px-2 text-right">Valor</th>
                  </tr>
                </thead>
                <tbody id="tabela-corpo" class="text-slate-600 text-sm font-semibold"></tbody>
              </table>
            </div>
            <div class="flex items-center justify-between border-t border-slate-100 mt-4 pt-4 text-xs font-bold text-slate-500">
              <span id="info-paginas">Página 1 de 1</span>
              <div class="flex gap-2">
